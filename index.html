<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#F8F4F2;--cream:#F3E9D2;--cream2:#EBDBBC;--red:#9E2A2F;--tan:#C9A58A;--gold:#E3B857;
--hand:'Gaegu','Patrick Hand','Comic Sans MS',cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--red);font-family:var(--hand);overflow:hidden;-webkit-tap-highlight-color:transparent}
/* scene */
#scene{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.rows{position:absolute;inset:-20% -10%;display:flex;flex-direction:column;justify-content:center;gap:3vh;transform:rotate(-6deg)}
.row{overflow:hidden;height:32vh;min-height:190px}
.track{display:flex;width:max-content;height:100%;align-items:center;animation:slide var(--d) linear infinite}
.row.rev .track{animation-direction:reverse}
@keyframes slide{to{transform:translateX(-50%)}}
.pol{--w:clamp(130px,19vh,230px);flex:none;width:var(--w);margin:0 calc(var(--w)*.14);padding:calc(var(--w)*.06) calc(var(--w)*.06) calc(var(--w)*.22);background:#fffdf8;border-radius:3px;box-shadow:0 4px 14px rgba(120,70,50,.22);position:relative;transform:rotate(var(--r))}
.pol::before{content:"";position:absolute;top:-9px;left:50%;width:42%;height:18px;margin-left:-21%;background:rgba(158,42,47,.55);transform:rotate(-3deg);border-radius:2px}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--cream)}
.pol.cake img{object-fit:contain;background:var(--paper)}
.pol.hb .t{aspect-ratio:3/4;background:var(--cream);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:calc(var(--w)*.2);line-height:1.05;letter-spacing:.06em;color:var(--red)}
/* centre card */
#hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.card{width:min(84vw,360px);background:var(--paper);border-radius:26px 30px 24px 32px;padding:20px 18px 18px;text-align:center;box-shadow:0 0 0 7px var(--cream),0 0 0 9px var(--tan),0 24px 50px rgba(90,40,30,.3);transform:rotate(1.2deg)}
.card img{width:100%;display:block}
.card h1{margin:2px 0 0;font-size:clamp(34px,9vw,46px);font-weight:700;letter-spacing:.07em;line-height:1}
.spk{position:absolute;width:22px;height:22px;color:var(--red);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.6) rotate(20deg);opacity:.5}}
/* music */
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:2px solid var(--red);background:var(--paper);color:var(--red);font:700 20px var(--hand);padding:6px 16px;border-radius:999px;cursor:pointer;display:none}
#mute:focus-visible,#env:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
body.opened #mute{display:block}
/* intro */
#intro{position:fixed;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity 1.2s ease,visibility 0s 1.2s}
body.opened #intro{opacity:0;visibility:hidden}
#env{position:relative;width:min(80vw,320px);aspect-ratio:3/2;border:0;background:none;padding:0;cursor:pointer;perspective:900px;font:inherit}
#env .back{position:absolute;inset:0;background:var(--cream2);border-radius:6px;box-shadow:0 14px 30px rgba(120,70,50,.25)}
#env .note{position:absolute;left:7%;right:7%;top:6%;height:88%;background:var(--paper);border:2px solid var(--tan);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:700;font-size:clamp(26px,8vw,34px);letter-spacing:.06em;transition:transform 1s cubic-bezier(.3,.9,.3,1) .45s;z-index:2}
#env .front{position:absolute;inset:0;background:var(--cream);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
#env .front::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 60%,rgba(201,165,138,.35))}
#env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--cream2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s ease,z-index 0s .28s;z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
#env .bow{position:absolute;left:50%;top:48%;width:34%;margin-left:-17%;z-index:5;transition:opacity .3s}
body.go #env .flap{transform:rotateX(180deg);z-index:1}
body.go #env .bow{opacity:0}
body.go #env .note{transform:translateY(-62%)}
#intro p{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
body.go #intro p{opacity:0;animation:none;transition:opacity .3s}
#scene,#hero{opacity:0;transition:opacity 1.6s ease .2s}
body.opened #scene,body.opened #hero{opacity:1}
@media (prefers-reduced-motion:reduce){.track{animation-duration:240s!important}.spk,#intro p{animation:none}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"><div class="rows" id="rows"></div></div>
<div id="hero">
  <div class="card" role="img" aria-label="Happy birthday cake with red bows">
    <img id="heroCake" alt="">
    <h1>Chuc Mung Sinh Nhat Me</h1>
  </div>
</div>
<button id="mute" type="button" aria-pressed="false">Music on</button>
<div id="intro">
  <button id="env" type="button" aria-label="Open your birthday card">
    <div class="back"></div>
    <div class="note">Chuc Mung Sinh Nhat Me</div>
    <div class="front"></div>
    <div class="flap"></div>
    <svg class="bow" viewBox="0 0 120 80" fill="#9E2A2F" aria-hidden="true">
      <path d="M60 40C34 4 4 14 10 38 6 64 36 74 60 40Z"/><path d="M60 40C86 4 116 14 110 38 114 64 84 74 60 40Z"/>
      <path d="M56 44 36 78l9 2 15-34Z"/><path d="M64 44 84 78l-9 2-15-34Z"/><circle cx="60" cy="40" r="9"/>
    </svg>
  </button>
  <p>tap to open</p>
</div>

  master=ctx.createGain();master.gain.value=.5;
  const d=ctx.createDelay(),fb=ctx.createGain(),wet=ctx.createGain();
  d.delayTime.value=.21;fb.gain.value=.32;wet.gain.value=.28;
  master.connect(ctx.destination);master.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(ctx.destination)}
const hz=s=>261.63*Math.pow(2,s/12);
function key(s,t,dur,v){
  [[1,1],[2,.38],[3,.15],[4,.06]].forEach(([m,a],i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=hz(s)*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.006);
    g.gain.setTargetAtTime(0,t+.02,dur*.45/(1+i*.7));
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur*2.5)})}
const B=.62;
const MEL=[[7,.75],[7,.25],[9,1],[7,1],[12,1],[11,2],
 [7,.75],[7,.25],[9,1],[7,1],[14,1],[12,2],
 [7,.75],[7,.25],[19,1],[16,1],[12,1],[11,1],[9,1],
 [17,.75],[17,.25],[16,1],[12,1],[14,1],[12,2]];
const CH={C:[-12,[-8,-5]],G:[-17,[-1,2]],F:[-19,[-3,0]]};
const BARS=['C','G','G','C','C','G','F','C'];
function song(){
  const t0=ctx.currentTime+.15;let b=0;
  MEL.forEach(([s,l])=>{key(s,t0+b*B,l*B*1.6,.34);b+=l});
  BARS.forEach((c,i)=>{const[bs,m]=CH[c],t=t0+i*3*B;
    key(bs,t,B*2.4,.3);m.forEach(n=>{key(n,t+B,B*1.2,.1);key(n,t+2*B,B*1.2,.1)})});
  setTimeout(song,(24*B+2.6)*1000)}
const env=document.getElementById('env'),mute=document.getElementById('mute');
env.addEventListener('click',()=>{
  if(document.body.classList.contains('go'))return;
  document.body.classList.add('go');
  try{initAudio();ctx.resume();song()}catch(e){mute.textContent='No sound'}
  setTimeout(()=>document.body.classList.add('opened'),2100)});
mute.addEventListener('click',()=>{
  muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:.5,ctx.currentTime,.05);
  mute.textContent=muted?'Music off':'Music on';mute.setAttribute('aria-pressed',muted)});
</script>
